<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GomLuis AI Hub</title>
  <meta name="description" content="심플한 AI 공부 자료 및 유용한 링크 모음">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Pretendard Font & FontAwesome Icons & Marked.js -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .clean-card {
      transition: all 0.2s ease;
    }
    .clean-card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    /* Markdown Body Styling in Cards */
    .markdown-content h1, .markdown-content h2, .markdown-content h3 {
      color: #ffffff;
      font-weight: 700;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content h1 { font-size: 1.2rem; }
    .markdown-content h2 { font-size: 1.05rem; }
    .markdown-content h3 { font-size: 0.95rem; }
    .markdown-content p { margin-bottom: 0.5rem; line-height: 1.6; }
    .markdown-content ul, .markdown-content ol {
      padding-left: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .markdown-content ul { list-style-type: disc; }
    .markdown-content ol { list-style-type: decimal; }
    .markdown-content li { margin-bottom: 0.25rem; }
    .markdown-content code {
      background-color: #0b0f19;
      color: #60a5fa;
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-family: monospace;
      font-size: 0.85em;
    }
    .markdown-content pre {
      background-color: #0b0f19;
      padding: 0.75rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-bottom: 0.75rem;
      border: 1px solid #1e293b;
    }
    .markdown-content blockquote {
      border-left: 3px solid #3b82f6;
      padding-left: 0.75rem;
      color: #94a3b8;
      margin: 0.75rem 0;
    }
    .markdown-content a {
      color: #60a5fa;
      text-decoration: underline;
    }
    .markdown-content hr {
      border-color: #334155;
      margin: 1rem 0;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex flex-col antialiased">

  <!-- ==================== HEADER ==================== -->
  <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="#" class="flex items-center space-x-2.5 font-bold text-white text-lg">
        <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm">
          <i class="fa-solid fa-brain"></i>
        </span>
        <span>GomLuis <span class="text-blue-400">AI</span></span>
      </a>

      <!-- Main Tabs (3 Simple Views) -->
      <nav class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 text-xs sm:text-sm font-medium">
        <button onclick="switchMainTab('links')" id="tabBtn-links" 
                class="px-3.5 py-1.5 rounded-lg transition-all bg-blue-600 text-white shadow">
          <i class="fa-solid fa-link mr-1"></i> 링크 모음
        </button>
        <button onclick="switchMainTab('notes')" id="tabBtn-notes" 
                class="px-3.5 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white">
          <i class="fa-solid fa-book-open mr-1"></i> 공부 노트
        </button>
        <button onclick="switchMainTab('roadmap')" id="tabBtn-roadmap" 
                class="px-3.5 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white">
          <i class="fa-solid fa-check mr-1"></i> 로드맵
        </button>
      </nav>

      <!-- GitHub Icon -->
      <a href="https://github.com/gomluis" target="_blank" rel="noopener noreferrer" 
         class="text-slate-400 hover:text-white transition-colors p-2 text-lg" title="GitHub 프로필">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">

    <!-- ========================================== -->
    <!-- TAB 1: LINKS (DEFAULT & MINIMAL)           -->
    <!-- ========================================== -->
    <div id="view-links" class="space-y-6">
      
      <!-- Simple Title & Search -->
      <div class="text-center py-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">AI 자료 & 유용한 링크</h1>
        <p class="text-sm text-slate-400">자주 쓰는 인공지능 도구와 필수 사이트 모음</p>

        <!-- Search Bar -->
        <div class="max-w-lg mx-auto relative mt-5">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" 
                 placeholder="이름이나 키워드 검색 (예: GPT, 강의, 파이토치)..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-800/70 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors">
        </div>

        <!-- Category Buttons (Clean Pills) -->
        <div class="flex flex-wrap justify-center gap-2 mt-4" id="categoryButtons">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- Links Grid -->
      <div id="linksContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2">
        <!-- Rendered via JS -->
      </div>

      <!-- Empty State -->
      <div id="emptySearch" class="hidden text-center py-12 text-slate-500 text-sm">
        검색 결과가 없습니다.
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: STUDY NOTES (DYNAMIC MARKDOWN)      -->
    <!-- ========================================== -->
    <div id="view-notes" class="hidden space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
        <div>
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-book-open text-blue-400"></i> AI 공부 노트
          </h2>
          <p class="text-xs text-slate-400 mt-1">
            깃허브 <code class="text-blue-400 font-mono bg-slate-900 px-1 py-0.5 rounded">notes/</code> 폴더에 올라온 마크다운(.md) 문서를 자동으로 불러옵니다.
          </p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="loadMarkdownNotes(true)" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 transition-colors">
            <i class="fa-solid fa-rotate-right text-xs"></i> 새로고침
          </button>
          <a href="https://github.com/gomluis/gomluis.github.io/tree/main/notes" target="_blank" 
             class="inline-flex items-center gap-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors">
            <i class="fa-solid fa-folder-open text-blue-400"></i> notes 폴더
          </a>
        </div>
      </div>

      <!-- Dynamic Markdown Notes Container -->
      <div id="dynamicNotesContainer" class="space-y-3">
        <div class="text-center py-12 text-slate-500 text-xs">
          <i class="fa-solid fa-spinner fa-spin text-lg text-blue-500 mb-2"></i><br>
          깃허브에서 공부 노트를 불러오는 중입니다...
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 3: ROADMAP (SIMPLE CHECKLIST)          -->
    <!-- ========================================== -->
    <div id="view-roadmap" class="hidden space-y-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-white">🎯 AI 공부 단계별 체크리스트</h2>
          <p class="text-xs text-slate-400 mt-1">완료한 항목을 클릭하여 진도를 체크해 보세요.</p>
        </div>
        <span id="roadmapProgressText" class="text-xs font-mono px-2.5 py-1 bg-blue-950 text-blue-400 border border-blue-800/60 rounded-lg">
          0 / 6 완료
        </span>
      </div>

      <div class="space-y-2" id="roadmapContainer">
        <!-- Rendered via JS -->
      </div>
    </div>

  </main>

  <!-- ==================== SIMPLE FOOTER ==================== -->
  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <p>GomLuis AI Archive • Hosted on GitHub Pages</p>
  </footer>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // 1. DATA: Clean curated list
    const linksData = [
      // Recommended YouTube & Media
      { name: "구글 안티그래비티 11월 대변신 가이드", category: "media", catName: "유튜브 영상", url: "https://www.youtube.com/watch?v=sLMj6HCperk", desc: "말로 시키고 /swarm으로 AI 팀을 꾸리는 구글 안티그래비티 핵심 업데이트 총정리", icon: "fa-brands fa-youtube" },
      { name: "클로드 코드 한도 절약 5가지 팁", category: "media", catName: "유튜브 숏츠", url: "https://youtube.com/shorts/5HgN-Bw9bb8", desc: "터미널 AI 코딩 시 토큰과 한도 낭비를 막는 5가지 필수 명령어", icon: "fa-brands fa-youtube" },
      { name: "클로드 코드로 AI 영상편집 자동화", category: "media", catName: "유튜브 영상", url: "https://www.youtube.com/watch?v=WqISVcMCHDI&list=PLC19JlQffqkA&index=1", desc: "프리미어 프로 없이 클로드 코드·Whisper·HyperFrames로 30초 인트로 영상 자동 제작 (스킬 공유)", icon: "fa-brands fa-youtube" },

      // Models
      { name: "ChatGPT", category: "models", catName: "AI 모델", url: "https://chatgpt.com", desc: "OpenAI 대화형 인공지능 (GPT-4o)", icon: "fa-bolt" },
      { name: "Claude", category: "models", catName: "AI 모델", url: "https://claude.ai", desc: "Anthropic의 정교한 코딩 & 문서 분석 AI", icon: "fa-comment" },
      { name: "Google AI Studio", category: "models", catName: "AI 모델", url: "https://aistudio.google.com", desc: "Gemini 모델 테스트 및 무료 API 발급", icon: "fa-wand-magic-sparkles" },
      { name: "Hugging Face", category: "models", catName: "오픈소스", url: "https://huggingface.co", desc: "오픈소스 AI 모델, 데이터셋, 웹 데모", icon: "fa-face-smile" },

      // Tools
      { name: "Google Colab", category: "tools", catName: "개발 도구", url: "https://colab.research.google.com", desc: "무료 클라우드 GPU 제공 주피터 노트북", icon: "fa-code" },

      // Food & Restaurants
      { name: "연보성 - 인천 부평 초가성비 중식당", category: "food", catName: "맛집 영상", url: "https://www.youtube.com/watch?v=nYPjRgTA2fE", desc: "📍 인천 부평구 부흥로334번길 63 | ⏰ 11:00~23:00 (2,3주 수 휴무) | 생전 처음 보는 놀라운 가격의 노포 중화요리 맛집 (그린바틀TV)", icon: "fa-solid fa-utensils" }
    ];

    const categories = [
      { id: "all", label: "전체보기" },
      { id: "models", label: "🤖 AI 모델" },
      { id: "tools", label: "🛠️ 개발 도구" },
      { id: "media", label: "🎬 AI 영상" },
      { id: "food", label: "🍜 맛집 영상" }
    ];

    const roadmapItems = [
      "파이썬 기초 문법 및 데이터 분석 라이브러리(NumPy, Pandas)",
      "머신러닝 & 딥러닝 기본 원리 (경사하강법, 인공신경망)",
      "PyTorch로 간단한 신경망 모델 직접 만들어보기",
      "Transformer 논문 아키텍처 및 Self-Attention 이해",
      "프롬프트 엔지니어링 및 오픈소스 LLM(Ollama) 로컬 실행",
      "RAG(검색 증강 생성) 파이프라인 실습해보기"
    ];

    let currentCategory = "all";
    let searchQuery = "";

    // TAB SWITCHING
    window.switchMainTab = function(tabName) {
      ['links', 'notes', 'roadmap'].forEach(t => {
        const view = document.getElementById(`view-${t}`);
        const btn = document.getElementById(`tabBtn-${t}`);
        if (t === tabName) {
          view.classList.remove('hidden');
          btn.className = "px-3.5 py-1.5 rounded-lg transition-all bg-blue-600 text-white shadow";
          if (tabName === 'notes') {
            loadMarkdownNotes();
          }
        } else {
          view.classList.add('hidden');
          btn.className = "px-3.5 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white";
        }
      });
    };

    // DYNAMIC MARKDOWN NOTES LOADER
    let notesLoaded = false;
    async function loadMarkdownNotes(force = false) {
      if (notesLoaded && !force) return;
      const container = document.getElementById("dynamicNotesContainer");
      container.innerHTML = `
        <div class="text-center py-10 text-slate-500 text-xs">
          <i class="fa-solid fa-spinner fa-spin text-base text-blue-500 mb-2"></i><br>
          깃허브에서 최신 공부 노트를 불러오는 중입니다...
        </div>
      `;

      const owner = "gomluis";
      const repo = "gomluis.github.io";

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/notes`);
        if (!res.ok) throw new Error("GitHub API status " + res.status);
        const files = await res.json();

        const mdFiles = files.filter(f => f.name.endsWith('.md')).sort((a,b) => a.name.localeCompare(b.name));

        if (mdFiles.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 bg-slate-800/30 rounded-xl border border-slate-700/60 text-slate-400 text-xs">
              <i class="fa-regular fa-folder-open text-2xl text-slate-500 mb-2 block"></i>
              아직 등록된 마크다운(.md) 파일이 없습니다.<br>
              깃허브 <code class="text-blue-400 font-mono">notes/</code> 폴더에 파일을 추가해 보세요!
            </div>
          `;
          notesLoaded = true;
          return;
        }

        const noteCards = await Promise.all(mdFiles.map(async (file, idx) => {
          const rawRes = await fetch(file.download_url);
          const mdText = await rawRes.text();

          // Extract title from first # line or filename
          const lines = mdText.split('\n');
          let title = file.name.replace(/\.md$/, '').replace(/^\d+[_]/, '');
          const firstHeader = lines.find(l => l.trim().startsWith('# '));
          if (firstHeader) {
            title = firstHeader.replace(/^#\s+/, '').trim();
          }

          const parsedHtml = (typeof marked !== 'undefined') ? marked.parse(mdText) : `<pre>${mdText}</pre>`;

          return `
            <details class="group bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 cursor-pointer" ${idx === 0 ? 'open' : ''}>
              <summary class="flex items-center justify-between font-semibold text-white list-none">
                <span class="flex items-center gap-2 text-sm sm:text-base">
                  <span class="w-6 h-6 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center text-xs font-mono">${idx + 1}</span>
                  ${title}
                </span>
                <div class="flex items-center gap-2">
                  <a href="${file.html_url}" target="_blank" onclick="event.stopPropagation()" 
                     class="text-slate-400 hover:text-blue-400 text-xs px-2 py-0.5 rounded bg-slate-900 border border-slate-700 transition-colors" title="깃허브에서 원본 보기">
                    <i class="fa-brands fa-github mr-1"></i>원본
                  </a>
                  <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-180 transition-transform"></i>
                </div>
              </summary>
              <div class="markdown-content mt-4 text-xs sm:text-sm text-slate-300 leading-relaxed pt-3 border-t border-slate-700/60">
                ${parsedHtml}
              </div>
            </details>
          `;
        }));

        container.innerHTML = noteCards.join('');
        notesLoaded = true;
      } catch (err) {
        console.error("Notes load error:", err);
        container.innerHTML = `
          <div class="p-4 bg-amber-950/30 border border-amber-800/50 rounded-xl text-xs text-amber-300">
            <i class="fa-solid fa-triangle-exclamation mr-1.5"></i>
            깃허브에서 노트를 불러오지 못했습니다. (API 한도 초과 또는 로컬 환경)<br>
            <a href="https://github.com/${owner}/${repo}/tree/main/notes" target="_blank" class="underline mt-1 inline-block text-amber-200">
              👉 깃허브 notes 폴더에서 직접 보기
            </a>
          </div>
        `;
      }
    }

    // RENDER CATEGORIES
    function renderCategoryButtons() {
      const container = document.getElementById("categoryButtons");
      container.innerHTML = categories.map(c => `
        <button onclick="setCategory('${c.id}')"
                class="px-3 py-1 rounded-full text-xs transition-colors ${
                  currentCategory === c.id 
                    ? 'bg-blue-600 text-white font-medium' 
                    : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700/60'
                }">
          ${c.label}
        </button>
      `).join("");
    }

    window.setCategory = function(catId) {
      currentCategory = catId;
      renderCategoryButtons();
      renderLinks();
    };

    // RENDER LINKS
    function renderLinks() {
      const container = document.getElementById("linksContainer");
      const emptyState = document.getElementById("emptySearch");

      const filtered = linksData.filter(item => {
        const matchesCategory = currentCategory === "all" || item.category === currentCategory;
        const matchesSearch = searchQuery === "" || 
          item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      container.innerHTML = filtered.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
           class="clean-card block p-4 bg-slate-800/50 hover:bg-slate-800/90 border border-slate-700/70 rounded-xl group">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-lg bg-slate-700/60 flex items-center justify-center text-slate-300 text-sm group-hover:bg-blue-600 group-hover:text-white transition-colors shrink-0">
                <i class="${item.icon.includes(' ') ? item.icon : 'fa-solid ' + item.icon}"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors">${item.name}</h3>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-900 text-slate-400">${item.catName}</span>
                </div>
                <p class="text-xs text-slate-400 mt-1 line-clamp-2 sm:line-clamp-3 leading-relaxed">${item.desc}</p>
              </div>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:text-blue-400 transition-colors pt-1"></i>
          </div>
        </a>
      `).join("");
    }

    // SEARCH LISTENER
    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderLinks();
    });

    // ROADMAP
    function initRoadmap() {
      const saved = JSON.parse(localStorage.getItem("gomluis_simple_roadmap") || "{}");
      const container = document.getElementById("roadmapContainer");

      function updateStats() {
        const currentSaved = JSON.parse(localStorage.getItem("gomluis_simple_roadmap") || "{}");
        const checked = Object.values(currentSaved).filter(Boolean).length;
        document.getElementById("roadmapProgressText").textContent = `${checked} / ${roadmapItems.length} 완료`;
      }

      container.innerHTML = roadmapItems.map((text, i) => {
        const id = `item_${i}`;
        const isChecked = saved[id] ? "checked" : "";
        return `
          <label class="flex items-center gap-3 p-3 bg-slate-800/40 border border-slate-700/60 rounded-xl cursor-pointer hover:bg-slate-800/80 transition-colors">
            <input type="checkbox" id="${id}" ${isChecked} 
                   class="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700 focus:ring-0 cursor-pointer"
                   onchange="toggleCheck('${id}')">
            <span class="text-xs sm:text-sm text-slate-300 select-none">${text}</span>
          </label>
        `;
      }).join("");

      window.toggleCheck = function(id) {
        const current = JSON.parse(localStorage.getItem("gomluis_simple_roadmap") || "{}");
        current[id] = !current[id];
        localStorage.setItem("gomluis_simple_roadmap", JSON.stringify(current));
        updateStats();
      };

      updateStats();
    }

    // INIT
    renderCategoryButtons();
    renderLinks();
    initRoadmap();
  </script>
</body>
</html>
